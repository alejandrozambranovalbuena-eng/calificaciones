<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" media="print" onload="this.media='all'">
<style>
  :root{
    --rojo:#C8202F; --rojo2:#9E1622; --rojo3:#7F111B;
    --azul:#1F2D5C; --azul2:#131D40; --azul-l:#e9ecf5;
    --oro:#D4A445; --oro1:#F3D58A; --oro2:#A9782A; --oro-l:#fbf3df;
    --crema:#FBF7EF; --txt:#1a2140; --mut:#5f6680; --line:#ece4d3;
    --err:#b3202c; --errbg:#fdeced; --info:#7a5a12; --infobg:#fff5dc;
    --r:26px;
    --sh:0 1px 0 rgba(255,255,255,.9) inset,0 12px 26px -10px rgba(19,29,64,.22),0 2px 6px rgba(19,29,64,.06);
    --fuente:"Baloo 2",ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:var(--fuente);color:var(--txt);line-height:1.35;min-height:100vh;font-size:17px;
       -webkit-tap-highlight-color:transparent;background:var(--crema);
       background-image:
         radial-gradient(circle at 8% 4%,rgba(212,164,69,.22),transparent 38%),
         radial-gradient(circle at 100% 32%,rgba(200,32,47,.10),transparent 36%),
         radial-gradient(circle at 0% 96%,rgba(31,45,92,.13),transparent 42%),
         radial-gradient(circle at 96% 100%,rgba(212,164,69,.16),transparent 35%)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  h1,h2,h3{line-height:1.15}

  /* ===== Encabezado institucional ===== */
  .top{position:relative;background:linear-gradient(160deg,#2a3b78 0%,var(--azul) 45%,var(--azul2) 100%);color:#fff;
       padding:12px 16px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-radius:0 0 28px 28px;
       box-shadow:0 10px 24px -10px rgba(19,29,64,.6);overflow:hidden}
  .top::before{content:"";position:absolute;inset:0;background:
       radial-gradient(circle at 85% -20%,rgba(255,255,255,.18),transparent 45%),
       repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 10px,transparent 10px 20px);pointer-events:none}
  .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;
       background:linear-gradient(90deg,var(--oro2),var(--oro1),var(--oro),var(--oro1),var(--oro2))}
  .top .in{position:relative;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .escudo{width:58px;height:58px;border-radius:50%;background:#fff;flex:none;padding:3px;
          box-shadow:0 0 0 3px var(--oro),0 0 0 5px rgba(243,213,138,.35),0 6px 14px rgba(0,0,0,.35)}
  .escudo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
  .top h1{font-size:21px;font-weight:800;letter-spacing:.2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .top .sch{font-size:13px;color:var(--oro1);font-weight:700;letter-spacing:.6px;text-transform:uppercase}
  .camp{margin-left:auto;font-size:12px;font-weight:800;color:var(--azul2);white-space:nowrap;padding:5px 11px;border-radius:99px;
        background:linear-gradient(180deg,var(--oro1),var(--oro));box-shadow:0 2px 0 var(--oro2),inset 0 1px 0 rgba(255,255,255,.6)}

  main{max-width:620px;margin:0 auto;padding:16px 14px 26px}
  .card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);border:1px solid rgba(31,45,92,.06);padding:20px;margin-bottom:16px;position:relative}
  .center{text-align:center}
  .big{font-size:76px;line-height:1;margin:4px 0 12px;display:inline-block;filter:drop-shadow(0 6px 6px rgba(19,29,64,.18))}
  .rebota{animation:rebota 1.8s ease-in-out infinite}
  @keyframes rebota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .muted{color:var(--mut);font-size:15px}
  .t{font-size:25px;font-weight:800;color:var(--azul)}
  .txt-cfg{font-size:20px;font-weight:700;line-height:1.45;margin:6px 0 18px;color:var(--azul2)}
  .anon{display:inline-flex;align-items:center;gap:6px;background:var(--azul-l);color:var(--azul);font-weight:800;font-size:14px;
        border-radius:99px;padding:7px 14px;margin-bottom:20px;border:1px solid rgba(31,45,92,.12)}

  /* Escudo grande (bienvenida / gracias / celebración) */
  .medalla{position:relative;width:170px;height:170px;margin:4px auto 14px}
  .medalla::before{content:"";position:absolute;inset:-14px;border-radius:50%;
       background:radial-gradient(circle,rgba(243,213,138,.55),rgba(243,213,138,0) 68%);animation:brilla 2.6s ease-in-out infinite}
  .medalla img{position:relative;width:100%;height:100%;border-radius:50%;background:#fff;object-fit:cover;
       box-shadow:0 0 0 5px #fff,0 0 0 9px var(--oro),0 14px 28px -8px rgba(19,29,64,.45)}
  .medalla .sello{position:absolute;right:-6px;bottom:2px;font-size:44px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));animation:rebota 1.8s ease-in-out infinite}
  @keyframes brilla{0%,100%{opacity:.6;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
  .nombre-col{font-family:Georgia,"Times New Roman",serif;font-size:22px;color:var(--azul2);letter-spacing:.3px}
  .nombre-col small{display:block;font-size:14px;color:var(--rojo);letter-spacing:3px;text-transform:uppercase;font-family:var(--fuente);font-weight:800}

  /* ===== Botones 3D ===== */
  .btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:64px;border-radius:20px;
       font-size:22px;font-weight:800;padding:12px 18px;transition:transform .08s,box-shadow .08s;letter-spacing:.2px}
  .btn::before{content:"";position:absolute;left:10px;right:10px;top:5px;height:42%;border-radius:16px 16px 40px 40px;
       background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,0));pointer-events:none}
  .btn.primary{color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);background:linear-gradient(180deg,#e2414e,var(--rojo) 55%,#ae1a27);
       box-shadow:0 6px 0 var(--rojo3),0 14px 22px -8px rgba(200,32,47,.6)}
  .btn.primary:active{transform:translateY(5px);box-shadow:0 1px 0 var(--rojo3),0 4px 10px -4px rgba(200,32,47,.5)}
  .btn.send{color:var(--azul2);background:linear-gradient(180deg,#f8e2a4,var(--oro) 60%,#bd8d33);
       box-shadow:0 6px 0 #8a6420,0 14px 22px -8px rgba(169,120,42,.6)}
  .btn.send:active{transform:translateY(5px);box-shadow:0 1px 0 #8a6420}
  .btn.ghost{color:#fff;font-size:19px;background:linear-gradient(180deg,#34478a,var(--azul) 60%,var(--azul2));
       box-shadow:0 6px 0 #0b1230,0 14px 22px -8px rgba(31,45,92,.55)}
  .btn.ghost:active{transform:translateY(5px);box-shadow:0 1px 0 #0b1230}
  .btn:disabled{opacity:.7;transform:none}
  .link{color:var(--azul);font-weight:800;font-size:16px;padding:10px 4px;min-height:46px}
  .link.muted{color:var(--mut)}
  .link:disabled{opacity:.35}
  .toprow{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 6px}

  /* ===== Cursos: baldosas 3D con colores del escudo ===== */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 12px;padding-bottom:6px}
  .curso{position:relative;overflow:hidden;border-radius:22px;min-height:104px;padding:12px 10px;font-weight:800;font-size:20px;
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);
         transition:transform .08s,box-shadow .08s}
  .curso::before{content:"";position:absolute;left:8px;right:8px;top:5px;height:44%;border-radius:16px 16px 50px 50px;
         background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0));pointer-events:none}
  .curso .e{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;
         background:rgba(255,255,255,.95);box-shadow:0 3px 0 rgba(0,0,0,.18);text-shadow:none}
  .curso.c0{background:linear-gradient(180deg,#e2414e,var(--rojo) 60%,#ab1926);box-shadow:0 6px 0 var(--rojo3),0 12px 18px -8px rgba(200,32,47,.55)}
  .curso.c1{background:linear-gradient(180deg,#34478a,var(--azul) 60%,var(--azul2));box-shadow:0 6px 0 #0b1230,0 12px 18px -8px rgba(31,45,92,.55)}
  .curso.c2{color:var(--azul2);text-shadow:0 1px 0 rgba(255,255,255,.5);background:linear-gradient(180deg,#f8e2a4,var(--oro) 60%,#bd8d33);
            box-shadow:0 6px 0 #8a6420,0 12px 18px -8px rgba(169,120,42,.55)}
  .curso:active{transform:translateY(5px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
  @media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}

  /* ===== Lista de profes ===== */
  .prog{height:16px;background:#efe8d8;border-radius:99px;overflow:hidden;margin:12px 0 8px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
  .prog>div{height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1);
       background:linear-gradient(180deg,var(--oro1),var(--oro) 55%,var(--oro2));position:relative;overflow:hidden}
  .prog>div::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);
       animation:barrido 2.2s linear infinite}
  @keyframes barrido{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .item{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border-radius:22px;
        box-shadow:0 5px 0 #e7dfcc,0 12px 20px -10px rgba(19,29,64,.25);padding:14px;margin-bottom:16px;min-height:86px;
        border:2px solid #f1ead9;transition:transform .08s,box-shadow .08s}
  .item:active{transform:translateY(4px);box-shadow:0 1px 0 #e7dfcc}
  .item.done{background:linear-gradient(180deg,#fffdf6,var(--oro-l));border-color:#ecd9a6;box-shadow:0 5px 0 #e6d3a0}
  .av{position:relative;width:56px;height:56px;border-radius:50%;color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;
      justify-content:center;flex:none;text-shadow:0 1px 0 rgba(0,0,0,.3);
      box-shadow:0 0 0 3px #fff,0 0 0 5px var(--oro),0 6px 10px -2px rgba(19,29,64,.35),inset 0 -6px 10px rgba(0,0,0,.18)}
  .av::before{content:"";position:absolute;left:18%;top:8%;width:46%;height:32%;border-radius:50%;background:rgba(255,255,255,.35)}
  .av.a0{background:radial-gradient(circle at 35% 30%,#ef5a66,var(--rojo) 55%,var(--rojo2))}
  .av.a1{background:radial-gradient(circle at 35% 30%,#4a5fa6,var(--azul) 55%,var(--azul2))}
  .av.a2{background:radial-gradient(circle at 35% 30%,#f6dd96,var(--oro) 55%,var(--oro2));color:var(--azul2);text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .av.sm{width:38px;height:38px;font-size:14px;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--oro)}
  .item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .item .tx b{font-size:19px;color:var(--azul2);line-height:1.15}
  .item .tx .mat{font-size:13px;color:var(--mut);line-height:1.25;margin-top:3px}
  .st{font-size:14px;font-weight:800;white-space:nowrap;flex:none;padding:7px 12px;border-radius:99px}
  .st.go{color:#fff;background:linear-gradient(180deg,#e2414e,var(--rojo));box-shadow:0 3px 0 var(--rojo3)}
  .st.ok{color:var(--azul2);background:linear-gradient(180deg,var(--oro1),var(--oro));box-shadow:0 3px 0 var(--oro2)}
  .st.pend{background:var(--infobg);color:var(--info)}
  .st.cont{color:#fff;background:linear-gradient(180deg,#34478a,var(--azul));box-shadow:0 3px 0 #0b1230}
  .ok-note{background:linear-gradient(180deg,#fffaf0,var(--oro-l));color:var(--azul2);border:2px solid #ecd9a6;border-radius:16px;
           padding:12px;font-weight:800;margin-top:10px;font-size:17px}
  .curso-tit{display:flex;align-items:center;gap:12px}
  .curso-tit .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none;
           background:linear-gradient(180deg,#34478a,var(--azul));box-shadow:0 4px 0 #0b1230}
  .lbl-k{font-size:13px;font-weight:800;color:var(--rojo);letter-spacing:1px;text-transform:uppercase}

  /* ===== Pregunta (una por pantalla) ===== */
  .quien{display:flex;align-items:center;gap:10px;background:#fff;border-radius:99px;padding:5px 16px 5px 5px;margin-bottom:12px;
         min-width:0;box-shadow:0 3px 0 #e7dfcc;border:1px solid #f1ead9}
  .quien b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--azul2)}
  .quien .mat{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quien div{min-width:0}
  .dots{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:2px 0 6px}
  .dot{width:13px;height:13px;border-radius:50%;background:#e2dccd;box-shadow:inset 0 1px 2px rgba(0,0,0,.15);transition:all .25s}
  .dot.ok{background:radial-gradient(circle at 35% 30%,var(--oro1),var(--oro) 60%,var(--oro2));box-shadow:none}
  .dot.cur{background:radial-gradient(circle at 35% 30%,#ef5a66,var(--rojo));transform:scale(1.4);box-shadow:0 0 0 3px rgba(200,32,47,.18)}
  .pnum{text-align:center;font-size:14px;font-weight:800;color:var(--mut);margin-bottom:10px;letter-spacing:.3px}
  .preg{text-align:center;padding:22px 18px 22px;overflow:hidden}
  .preg::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;
       background:linear-gradient(90deg,var(--rojo) 0 33%,var(--oro) 33% 66%,var(--azul) 66%)}
  .preg .pe{display:flex;align-items:center;justify-content:center;width:104px;height:104px;margin:2px auto 14px;border-radius:50%;
       font-size:58px;line-height:1;background:radial-gradient(circle at 35% 28%,#fff,#fbf2dc 60%,#f1dfb2);
       box-shadow:0 0 0 4px #fff,0 0 0 7px var(--oro),0 12px 20px -8px rgba(169,120,42,.6);animation:flota 2.4s ease-in-out infinite}
  @keyframes flota{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
  .preg .pt{font-size:23px;font-weight:800;line-height:1.28;color:var(--azul2)}
  .chip{display:inline-block;font-size:12px;font-weight:800;color:var(--azul);background:var(--azul-l);border-radius:99px;padding:4px 11px;margin-top:12px}
  .lv{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:7px 14px 7px 8px;border-radius:20px;text-align:left;
      background:linear-gradient(180deg,#fff,var(--cl));border:2px solid var(--cb);font-size:19px;font-weight:800;color:var(--azul2);
      margin-bottom:12px;box-shadow:0 5px 0 var(--cb),0 10px 16px -10px rgba(19,29,64,.35);transition:transform .08s,box-shadow .08s,background .15s}
  .lv:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cb)}
  .lv .le{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;line-height:1;flex:none;
      background:#fff;box-shadow:0 0 0 2px var(--cb),0 3px 6px rgba(0,0,0,.12)}
  .lv .lt{flex:1}
  .lv .lc{opacity:0;width:34px;height:34px;border-radius:50%;background:#fff;color:var(--c);display:flex;align-items:center;
      justify-content:center;font-size:19px;font-weight:900;flex:none;transform:scale(.3);transition:all .22s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .lv.on{background:linear-gradient(180deg,var(--c1),var(--c));border-color:var(--cd);color:var(--ct);
      box-shadow:0 5px 0 var(--cd),0 14px 22px -10px var(--c);animation:pop .4s}
  .lv.on .le{box-shadow:0 0 0 3px rgba(255,255,255,.7),0 3px 6px rgba(0,0,0,.2)}
  .lv.on .lc{opacity:1;transform:scale(1)}
  .lv:disabled{opacity:.6}
  .lv .lc::before{content:"";width:8px;height:15px;border:solid currentColor;border-width:0 4px 4px 0;transform:rotate(45deg);margin-top:-4px}
  /* ===== Bolitas de cantidad (se entienden sin leer) ===== */
  .ld{display:flex;gap:4px;flex:none;align-items:center}
  .ld i{width:9px;height:9px;border-radius:50%;background:rgba(19,29,64,.13);display:block}
  .ld i.on{background:var(--c);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2)}
  .lv.on .ld i{background:rgba(255,255,255,.35)}
  .lv.on .ld i.on{background:var(--ct)}
  .memo{letter-spacing:2px;font-size:15px}
  .item .tx .mat .memo{font-size:17px}

  /* ===== Tarjeta "¿Cómo se responde?" (pequeños) ===== */
  .como{text-align:center;border:2px dashed #ecd9a6;background:linear-gradient(180deg,#fff,#fffaf0)}
  .como-t{font-size:20px;font-weight:800;color:var(--azul2);margin-bottom:10px}
  .como-esc{display:flex;gap:6px;justify-content:center;align-items:flex-end}
  .como-n{flex:1;max-width:76px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 2px;border-radius:14px;
      background:var(--cl);border:2px solid var(--cb);height:calc(66px + var(--i)*10px);justify-content:flex-end}
  .como-n b{font-size:28px;line-height:1}
  .como-n .ld{gap:2px;flex-wrap:wrap;justify-content:center;max-width:44px}
  .como-n .ld i{width:6px;height:6px}
  .como-f{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-weight:800;font-size:15px;color:var(--azul2)}
  .como-f .fl{font-size:22px;color:var(--oro2)}

  /* ===== Modo pequeños: más grande y con menos texto ===== */
  body.peques .preg .pt{font-size:27px;line-height:1.25}
  body.peques .preg .pe{width:120px;height:120px;font-size:70px}
  body.peques .preg .chip, body.peques .pnum{display:none}
  body.peques .lv{min-height:74px;font-size:21px}
  body.peques .lv .le{width:58px;height:58px;font-size:40px}
  body.peques .ld i{width:11px;height:11px}
  body.peques .item .tx b{font-size:20px}
  body.peques .item .tx .mat .memo{font-size:24px}
  body.peques .dots .dot{width:16px;height:16px}

  /* ===== PC (pantalla ancha): escalera de opciones que ocupa la pantalla ===== */
  @media (min-width:900px){
    body.en-form main{max-width:1120px;padding-top:8px}
    body.en-form .top{padding-top:7px;padding-bottom:10px}
    body.en-form .escudo{width:46px;height:46px}
    body.en-form .toprow{margin:-4px auto 0}
    body.en-form .toprow,body.en-form .quien,body.en-form .dots,body.en-form .pnum{max-width:760px;margin-left:auto;margin-right:auto}
    body.en-form .quien{margin-bottom:6px}
    body.en-form .pnum{margin-bottom:6px}
    /* pregunta en horizontal: emoji a la izquierda, texto a la derecha */
    body.en-form .preg{max-width:900px;margin:0 auto 16px;padding:16px 26px;display:flex;align-items:center;gap:24px;text-align:left}
    body.en-form .preg .pe{width:96px;height:96px;font-size:56px;margin:0;flex:none}
    body.peques.en-form .preg .pe{width:108px;height:108px;font-size:64px}
    body.en-form .preg .chip{margin-top:6px}
    body.en-form .preg .pt{font-size:30px}
    body.peques.en-form .preg .pt{font-size:36px}
    .escala{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px;align-items:end;max-width:1080px;margin:0 auto}
    .escala .lv{flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;gap:9px;margin:0;
        padding:12px 8px 14px;height:calc(150px + var(--i)*20px);min-height:0;font-size:19px}
    .escala .lv .le{width:70px;height:70px;font-size:46px}
    body.peques .escala .lv{height:calc(168px + var(--i)*22px);font-size:22px}
    body.peques .escala .lv .le{width:82px;height:82px;font-size:56px}
    .escala .lv .lt{flex:none;line-height:1.1}
    .escala .lv .ld{flex-wrap:wrap;justify-content:center;max-width:90%}
    .escala .lv .lc{position:absolute;top:10px;right:10px}
  }

  /* PC con pantalla bajita (p. ej. 1280×720 con la barra del navegador) */
  @media (min-width:900px) and (max-height:640px){
    body.en-form .quien{display:none}
    body.en-form .preg{padding:10px 22px;margin-bottom:12px}
    body.en-form .preg .pe,body.peques.en-form .preg .pe{width:80px;height:80px;font-size:46px}
    .escala .lv{height:calc(128px + var(--i)*16px)}
    body.peques .escala .lv{height:calc(140px + var(--i)*18px)}
    .escala .lv .le,body.peques .escala .lv .le{width:62px;height:62px;font-size:42px}
  }

  /* Emojis como imagen (PC viejos sin emojis de color) */
  img.emj{height:1em;width:1em;margin:0 .04em;vertical-align:-.12em;display:inline-block;border:0}
  .lv .le img.emj,.preg .pe img.emj,.curso .e img.emj{vertical-align:0;margin:0}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.05)}100%{transform:scale(1)}}
  .paso{animation:entra .3s cubic-bezier(.2,.8,.2,1)}
  .paso.atras{animation:entraAtras .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes entra{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
  @keyframes entraAtras{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}

  /* ===== Pantalla final del docente ===== */
  .meta{font-size:54px;line-height:1;display:inline-block;filter:drop-shadow(0 6px 6px rgba(19,29,64,.2))}
  .resumen{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0 4px}
  .rs{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,#fff,#fbf5e6);border:2px solid #ecd9a6;border-radius:16px;
      padding:6px 11px;font-size:24px;min-height:50px;box-shadow:0 4px 0 #e6d3a0}
  .rs:active{transform:translateY(3px);box-shadow:0 1px 0 #e6d3a0}
  .rs small{font-size:12px;color:var(--rojo);font-weight:800}
  .lbl{font-size:20px;font-weight:800;display:block;margin-bottom:10px;color:var(--azul2)}
  .resp{font-size:14px;background:var(--infobg);color:var(--info);border-radius:14px;padding:9px 12px;margin-bottom:10px;font-weight:700;border:1px solid #f1dfae}
  textarea{width:100%;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:18px;padding:12px;resize:vertical;
           min-height:112px;background:#fffdf8;color:var(--txt);box-shadow:inset 0 2px 4px rgba(0,0,0,.05)}
  textarea:focus{outline:none;border-color:var(--oro);background:#fff;box-shadow:0 0 0 4px rgba(212,164,69,.2)}
  .cnt{text-align:right;font-size:13px;color:var(--mut);margin-top:4px;font-weight:700}
  .msg{border-radius:18px;padding:14px;margin-bottom:16px;font-size:16px;font-weight:800;background:var(--errbg);color:var(--err);border:2px solid #f6c9cd}
  .msg.info{background:var(--infobg);color:var(--info);border-color:#f1dfae}
  .hide{display:none!important}

  /* ===== Varios ===== */
  .spin{width:54px;height:54px;border-radius:50%;margin:46px auto 14px;border:6px solid #ece4d3;border-top-color:var(--rojo);
        border-right-color:var(--oro);border-bottom-color:var(--azul);animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--azul2);color:#fff;padding:13px 20px;
         border-radius:16px;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
         max-width:90vw;text-align:center;z-index:30;border-bottom:4px solid var(--oro);box-shadow:0 12px 24px -8px rgba(0,0,0,.45)}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #celebra{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
           background:radial-gradient(circle,rgba(255,252,243,.97),rgba(251,243,223,.94));z-index:25;text-align:center;padding:20px}
  #celebra .medalla{animation:salta .65s cubic-bezier(.2,.9,.3,1.4)}
  #celebra b{font-size:34px;font-weight:800;color:var(--rojo);margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.08)}
  @keyframes salta{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
  .confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:26}
  .confeti i{position:absolute;top:-16px;width:10px;height:16px;border-radius:3px;animation-name:cae;animation-timing-function:ease-in;animation-fill-mode:forwards}
  .confeti i.r{border-radius:50%;width:11px;height:11px}
  @keyframes cae{to{transform:translate(var(--dx),106vh) rotate(var(--rot))}}
  footer{text-align:center;font-size:11px;color:#a69f8c;padding:6px 0 18px}
  @media (max-width:350px){
    .lv{min-height:56px;font-size:17px;margin-bottom:10px}.lv .le{width:42px;height:42px;font-size:27px}
    .preg .pe{width:88px;height:88px;font-size:48px}.preg .pt{font-size:20px}
    .card{padding:16px}.medalla{width:140px;height:140px}.top h1{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function leerEscala(e) {
  if (!e || typeof e !== "object") return ESCALA_DEF;
  const vistos = new Set();
  let niv = (Array.isArray(e.niveles) ? e.niveles : [])
    .map(n => ({ v: Math.round(Number(n && n.v)), emoji: String((n && n.emoji) || "").trim(), texto: String((n && n.texto) || "").trim() }))
    .filter(n => Number.isInteger(n.v) && n.v >= 1 && !vistos.has(n.v) && vistos.add(n.v))
    .sort((a, b) => a.v - b.v);
  let max = Math.round(Number(e.max));
  if (!Number.isInteger(max) || max < 2) max = niv.length ? niv[niv.length - 1].v : 0;
  niv = niv.filter(n => n.v <= max).map(n => ({ v: n.v, emoji: n.emoji || "⭐", texto: n.texto || String(n.v) }));
  if (niv.length < 2) return ESCALA_DEF;
  return { max, niveles: niv };
}
function fechaCierre(c) {
  if (!c) return "";
  if (typeof c === "string") return /^\d{4}-\d{2}-\d{2}/.test(c.trim()) ? c.trim().slice(0, 10) : "";
  try {
    const d = typeof c.toDate === "function" ? c.toDate() : null;
    if (d) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  } catch (e) {}
  return "";
}

async function cargar() {
  S.screen = "loading"; render();
  try {
    const cs = await conTiempo(getDoc(doc(db, "evaluacion_config", "actual")), T_LECTURA);
    if (!cs.exists()) return cerrar("");
    const cfg = cs.data() || {};
    if (cfg.abierta !== true) return cerrar("");
    const cierre = fechaCierre(cfg.cierre);
    if (cierre && hoyISO() > cierre) return cerrar("");

    const vistos = new Set();
    S.preg = (Array.isArray(cfg.preguntas) ? cfg.preguntas : [])
      .filter(q => q && q.id != null && String(q.texto || "").trim())
      .map(q => ({ id: String(q.id).trim(), texto: String(q.texto).trim(), textoPeques: String(q.textoPeques || "").trim(),
                   emoji: String(q.emoji || "").trim() || "⭐", dim: q.dim ? String(q.dim).trim() : "" }))
      .filter(q => q.id && !vistos.has(q.id) && vistos.add(q.id));
    S.campana = String(cfg.campana || "").trim();
    const d = Number(cfg.desdeGrado);
    S.desde = Number.isFinite(d) ? d : 0;
    S.escala = leerEscala(cfg.escala);
    const com = cfg.comentario;
    S.comentario = (com && typeof com === "object")
      ? { activo: com.activo === true, texto: String(com.texto || "").trim() || COMENTARIO_DEF }
      : { activo: true, texto: COMENTARIO_DEF };   // configuración vieja: comentario opcional como en v1
    S.bienvenida = String(cfg.bienvenida || "").trim() || BIENVENIDA_DEF;
    // Modo pequeños: por defecto activo para PRIMERO (3) a TERCERO (5)
    const pq = (cfg.peques && typeof cfg.peques === "object") ? cfg.peques : {};
    const hasta = Number(pq.hasta);
    S.peques = { activo: pq.activo !== false, hasta: Number.isFinite(hasta) ? hasta : 5 };
    S.gracias = String(cfg.gracias || "").trim() || GRACIAS_DEF;
    if (!S.campana || !S.preg.length) return cerrar("La encuesta todavía no está lista.");

    const ds = await conTiempo(getDoc(doc(db, "system", "data")), T_LECTURA);
    if (!ds.exists()) throw Object.assign(new Error("sin datos"), { code: "sin-datos" });
    procesar(ds.data() || {});

    const camp = document.getElementById("camp");
    camp.textContent = S.campana + (SALA ? " · 🖥️ Sala" : ""); camp.classList.remove("hide"); pintarEmojis(camp);

    S.screen = "welcome"; navDepth = 0;
    try { history.replaceState({ s: "welcome", d: 0 }, ""); } catch (e) {}
    render();
  } catch (e) {
    S.err = describirLectura(e); S.screen = "error"; render();
  }
}
function cerrar(nota) { S.cerradoNota = nota || ""; S.screen = "closed"; render(); }

function procesar(data) {
  S.subj = new Map(lista(data.subjects).map(s => [String(s.id), s]));
  S.teach = new Map(lista(data.teachers).map(t => [String(t.id), t]));
  S.asig = lista(data.subjectAssignments);
  S.courses = lista(data.courses)
    .map(c => ({ id: c.id, name: nombre(c) || String(c.id), order: Number(c.order), idx: gradoIdx(nombre(c)) }))
    .filter(c => c.id != null && c.idx >= 0 && c.idx >= S.desde)
    .map(c => Object.assign(c, { items: itemsDe(c) }))
    .filter(c => c.items.length > 0)
    .sort((a, b) => (Number.isFinite(a.order) ? a.order : 1e9) - (Number.isFinite(b.order) ? b.order : 1e9) ||
                    a.name.localeCompare(b.name, "es", { numeric: true }));
}
function docenteDe(a) {
  if (a.currentTeacherId) return a.currentTeacherId;
  const h = (Array.isArray(a.history) ? a.history : lista(a.history)).filter(x => x && typeof x === "object" && !x.removedAt);
  if (!h.length) return null;
  const u = h[h.length - 1];
  return u.teacherId || u.teacher || u.id || null;
}
// Una tarjeta por DOCENTE en el curso, con sus materias (sin Disciplina ni Conducta)
function itemsDe(course) {
  const porDocente = new Map();
  for (const a of S.asig) {
    if (a.courseId == null || String(a.courseId) !== String(course.id)) continue;
    const sid = a.subjectId;
    if (sid == null || EXCLUIR.has(String(sid))) continue;
    const sub = S.subj.get(String(sid));
    if (!sub) continue;
    const sn = nombre(sub);
    if (!sn || norm(sn) === "DISCIPLINA" || norm(sn) === "CONDUCTA") continue;
    const tid = docenteDe(a);
    if (tid == null) continue;
    const t = S.teach.get(String(tid));
    if (!t) continue;
    const k = String(tid);
    if (!porDocente.has(k)) porDocente.set(k, {
      courseId: course.id, courseName: course.name,
      teacherId: tid, teacherName: nombre(t) || "Profe",
      subjectIds: [], subjectNames: []
    });
    const it = porDocente.get(k);
    if (!it.subjectIds.some(x => String(x) === String(sid))) { it.subjectIds.push(sid); it.subjectNames.push(sn); }
  }
  return Array.from(porDocente.values())
    .map(it => Object.assign(it, {
      materias: Array.from(new Set(it.subjectNames)).sort((x, y) => x.localeCompare(y, "es")).join(", ")
    }))
    .sort((x, y) => x.teacherName.localeCompare(y.teacherName, "es"));
}
function describirLectura(e) {
  const c = (e && e.code) || "";
  if (c === "permission-denied") return "El sistema no nos dejó abrir la encuesta. Avísale a tu profe. 🙏";
  if (c === "sin-datos") return "No encontramos la lista de cursos y profes. Avísale a tu profe. 🙏";
  if (sinRed() || c === "timeout" || c === "unavailable" || /offline/i.test((e && e.message) || ""))
    return "Parece que no hay internet o está muy lento. Revisa la conexión e inténtalo otra vez.";
  return "Pasó algo inesperado" + (c ? ` (${c})` : "") + ". Inténtalo otra vez.";
}
function describirEnvio(e) {
  const c = (e && e.code) || "";
  if (c === "permission-denied")
    return "🚫 El sistema no recibió tu evaluación. Avísale a tu profe. Tus respuestas siguen guardadas aquí.";
  if (sinRed() || c === "unavailable" || c === "deadline-exceeded")
    return "📶 ¡Uy! Se fue el internet. Tus respuestas siguen aquí; toca “Enviar 💌” para intentar otra vez.";
  return "😕 No se pudo enviar" + (c ? ` (${c})` : "") + ". Tus respuestas siguen aquí; inténtalo otra vez.";
}

const TW_JS = "https://cdn.jsdelivr.net/npm/@twemoji/api@15.1.0/dist/twemoji.min.js";

function soportaEmoji() {
  try {
    const c = document.createElement("canvas"); c.width = c.height = 40;
    const x = c.getContext("2d"); if (!x) return false;
    x.textBaseline = "top";
    x.font = '32px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Segoe UI Symbol",sans-serif';
    const prueba = ch => {
      x.clearRect(0, 0, 40, 40); x.fillText(ch, 0, 0);
      const d = x.getImageData(0, 0, 40, 40).data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] > 100 && (Math.abs(d[i] - d[i + 1]) > 30 || Math.abs(d[i + 1] - d[i + 2]) > 30)) return true; // hay color
      }
      return false;
    };
    return prueba("\u{1F929}") && prueba("\u{1F9E0}");   // 🤩 y 🧠 (emojis "nuevos")
  } catch (e) { return false; }
}
const EMOJI_IMG = (() => {

    const q = new URLSearchParams(location.search).get("emoji");

function mezcla(a, b, t) { return a.map((x, i) => Math.round(x + (b[i] - x) * t)); }
const hex = c => "#" + c.map(x => x.toString(16).padStart(2, "0")).join("");
// Paleta fija (sin mezclas turbias): rojo → coral → naranja → dorado → azul → azul marino
const PALETA_NIVEL = [[200, 32, 47], [221, 75, 57], [224, 138, 46], [212, 164, 69], [63, 98, 181], [31, 45, 92]];
function estiloNivel(t) {
  const c = PALETA_NIVEL[Math.round(Math.min(1, Math.max(0, t)) * (PALETA_NIVEL.length - 1))];
  const W = [255, 255, 255], K = [0, 0, 0];

  return `--c:${hex(c)};--c1:${hex(mezcla(c, W, 0.22))};--cd:${hex(mezcla(c, K, 0.32))};` +
         `--cl:${hex(mezcla(c, W, 0.88))};--cb:${hex(mezcla(c, W, 0.62))};--ct:${lum > 0.55 ? "#131D40" : "#fff"}`;
}

let salaTimer = null, salaUltimo = Date.now();
function nuevoEstudiante() {
  if (pendientes.size) { toast("⏳ Espera un momentico: se está enviando una evaluación"); return; }
  hechosMem.clear(); drafts.clear();
  DEV = nuevoId();                       // el siguiente niño cuenta como otro estudiante
  S.course = null; S.items = []; S.cur = null; S.next = null; S.anim = false; S.dir = "";
  navDepth = 0;
  try { history.replaceState({ s: "welcome", d: 0 }, ""); } catch (e) {}
  S.screen = "welcome"; render(); arriba();
  salaUltimo = Date.now();
}
function cuentaGracias() {
  clearInterval(salaTimer); salaTimer = null;
  if (S.screen !== "thanks") return;
  let n = T_GRACIAS_SALA;
  const pinta = () => { const el = document.getElementById("cuenta"); if (el) el.textContent = n; };
  pinta();
  salaTimer = setInterval(() => {
    n--; pinta();
    if (n <= 0) { clearInterval(salaTimer); salaTimer = null; if (S.screen === "thanks") nuevoEstudiante(); }
  }, 1000);
}
if (SALA) {
  ["pointerdown", "keydown", "input"].forEach(ev => document.addEventListener(ev, () => { salaUltimo = Date.now(); }, true));
  setInterval(() => {
    if (["loading", "closed", "error", "welcome", "thanks"].includes(S.screen)) return;
    if (pendientes.size || Date.now() - salaUltimo < T_INACTIVO_SALA) return;
    nuevoEstudiante(); toast("Se reinició para el siguiente estudiante 👋");
  }, 15000);
}

  <div class="card center">
    ${medalla("👋")}
    <div class="nombre-col">Liceo Moderno Suesca<small>Evaluación docente</small></div>
    <p class="txt-cfg">${escBr(S.bienvenida)}</p>
    <div class="anon">🔒 No te pedimos tu nombre</div>
    <button class="btn primary" data-act="start">¡Empezar! 🚀</button>
    ${SALA ? `<p class="muted" style="margin-top:14px">🖥️ Computador del colegio: cuando termines, toca <b>“Siguiente estudiante”</b>.</p>` : ""}
  </div>`;

function vCourses() {
  if (!S.courses.length) return `
    <div class="card center"><div class="big">🤔</div><h2 class="t">No hay cursos disponibles</h2>
    <p class="muted" style="margin-top:10px">Por ahora ningún curso puede responder esta encuesta.</p></div>`;
  return `
    <div class="toprow"><button class="link" data-act="back">‹ Atrás</button></div>
    <div class="card center"><div class="big" style="font-size:54px;margin-bottom:6px">🎒</div><h2 class="t">¿En qué curso estás?</h2>
      <p class="muted" style="margin-top:6px">Toca tu curso 👇</p></div>
    <div class="grid">${S.courses.map((c, i) =>
      `<button class="curso c${i % 3}" data-act="course" data-i="${i}">
         <span class="e">📚</span>${esc(c.name)}</button>`).join("")}</div>`;
}

function vList() {
  const c = S.course, n = S.items.length, h = S.items.filter(isDone).length;
  const pct = n ? Math.round(h * 100 / n) : 0;
  return `
    <div class="toprow"><button class="link" data-act="back">‹ Cambiar curso</button></div>
    <div class="card">
      <div class="curso-tit"><span class="ic">📚</span><div><div class="lbl-k">Tu curso</div><h2 class="t">${esc(c.name)}</h2></div></div>
      <div class="prog"><div style="width:${pct}%"></div></div>
      <p style="font-weight:800">${h} de ${n} profes listos ${h ? "⭐" : ""}</p>
      ${h === n ? `<p class="ok-note">🎉 ¡Ya evaluaste a todos tus profes!</p>`
                : `<p class="muted" style="margin-top:4px">Toca a un profe para empezar. Si quieres, puedes saltarlo.</p>`}
    </div>
    ${esPeques() ? vComo() : ""}
    ${S.items.map((it, i) => tarjeta(it, i)).join("")}
    ${SALA ? `<button class="btn ghost" style="margin-top:8px" data-act="terminar">🏁 Ya terminé · Siguiente estudiante</button>` : ""}`;
}
function tarjeta(it, i) {
  const done = isDone(it), pend = pendientes.has(dk(it));
  const d = drafts.get(dk(it));
  const st = done ? `<span class="st ok">✅ ¡Listo!</span>`
           : pend ? `<span class="st pend">⏳ Enviando</span>`
           : d && respondidas(d) > 0 ? `<span class="st cont">Seguir ✏️</span>`
           : `<span class="st go">Evaluar 👉</span>`;
  return `<button class="item${done ? " done" : ""}" data-act="open" data-i="${i}">
      <span class="av ${avClase(it.teacherId)}">${esc(iniciales(it.teacherName))}</span>
      <span class="tx"><b>${esc(it.teacherName)}</b><span class="mat"><span class="memo">${emosDe(it)}</span> ${esc(it.materias)}</span></span>${st}</button>`;
}

/* ---- Formulario: una pregunta por pantalla ---- */
function vForm() {
  const it = S.cur, d = draft(it), N = S.preg.length;
  const pend = pendientes.has(dk(it));
  const step = Math.min(Math.max(0, d.step), N);
  const animCls = S.dir === "atras" ? "paso atras" : S.dir === "adelante" ? "paso" : "";
  S.dir = "";
  const quien = `
    <div class="quien"><span class="av sm ${avClase(it.teacherId)}">${esc(iniciales(it.teacherName))}</span>
      <div><b>${esc(it.teacherName)}</b><span class="mat"><span class="memo">${emosDe(it)}</span> ${esc(it.materias)}</span></div></div>`;
  const top = `
    <div class="toprow">
      <button class="link" data-act="prev" ${pend ? "disabled" : ""}>‹ ${step === 0 ? "Mis profes" : "Anterior"}</button>
      <button class="link muted" data-act="skip" ${pend ? "disabled" : ""}>Saltar profe ›</button>
    </div>`;
  const progreso = N <= 14
    ? `<div class="dots">${S.preg.map((q, i) => `<span class="dot${i === step ? " cur" : valido(d.r[q.id]) ? " ok" : ""}"></span>`).join("")}
       <span class="dot${step === N ? " cur" : ""}" style="border-radius:4px"></span></div>`
    : `<div class="prog" style="margin:4px 0 6px"><div style="width:${Math.round(respondidas(d) * 100 / N)}%"></div></div>`;

  if (step < N) {
    const q = S.preg[step], sel = d.r[q.id], niv = S.escala.niveles, L = niv.length;
    return `${top}${quien}${progreso}
      <div class="pnum">Pregunta ${step + 1} de ${N}</div>
      <div class="${animCls}">
        <div class="card preg">
          <span class="pe">${esc(q.emoji)}</span>
          <div class="pq"><div class="pt">${esc(esPeques() && q.textoPeques ? q.textoPeques : q.texto)}</div>
          ${q.dim ? `<span class="chip">${esc(q.dim)}</span>` : ""}</div>
        </div>
        <div class="escala" style="--n:${L}" role="group" aria-label="${esc(q.texto)}">
          ${niv.map((n, i) => `<button class="lv${sel === n.v ? " on" : ""}" style="${estiloNivel(L > 1 ? i / (L - 1) : 1)};--i:${i}"
              data-act="opt" data-v="${n.v}" aria-pressed="${sel === n.v}">
              <span class="le">${esc(n.emoji)}</span><span class="lt">${esc(n.texto)}</span>${bolitas(i, L)}<span class="lc"></span></button>`).join("")}
        </div>
      </div>`;
  }

  // Pantalla final de este profe: resumen + comentario + Enviar
  const com = S.comentario.activo ? `
    <div class="card">
      <label for="com" class="lbl">${esc(S.comentario.texto)}</label>
      <p class="resp">💬 Escribe con respeto: tu mensaje es para ayudar a mejorar. Sin groserías ni nombres de compañeros.</p>
      <textarea id="com" maxlength="${MAX_COM}" rows="4" placeholder="Escribe aquí… (no es obligatorio)">${esc(d.c)}</textarea>
      <div class="cnt"><span id="cc">${d.c.length}</span>/${MAX_COM}</div>
    </div>` : "";
  return `${top}${quien}${progreso}
    <div class="${animCls}">
      <div class="card center">
        <div class="meta">🏁</div>
        <h2 class="t" style="margin:8px 0 6px">¡Ya casi terminas!</h2>
        <p class="muted">Estas fueron tus respuestas. Si quieres cambiar una, tócala.</p>
        <div class="resumen">${S.preg.map((q, i) => {
          const n = S.escala.niveles.find(x => x.v === d.r[q.id]);
          return `<button class="rs" data-act="goto" data-i="${i}" ${pend ? "disabled" : ""}><small>${i + 1}</small>${n ? esc(n.emoji) : "❔"}</button>`;
        }).join("")}</div>
      </div>
      ${com}
      <div id="msg" class="msg${d.err ? "" : " hide"}">${esc(d.err)}</div>
      <button id="send" class="btn send" data-act="send">${pend ? "Intentar otra vez 🔄" : "Enviar 💌"}</button>
      <p class="muted center" style="margin-top:12px">🔒 Es anónima: nadie sabrá que fuiste tú.</p>
    </div>`;
}

const vThanks = () => SALA ? `
  <div class="card center">
    ${medalla("🎉")}
    <p class="txt-cfg">${escBr(S.gracias)}</p>
    <button class="btn primary" data-act="nuevo">Siguiente estudiante 👉</button>
    <p class="muted" style="margin-top:14px">Se reinicia solo en <b id="cuenta">${T_GRACIAS_SALA}</b> segundos.</p>
  </div>` : `
  <div class="card center">
    ${medalla("🎉")}
    <p class="txt-cfg">${escBr(S.gracias)}</p>
    <button class="btn ghost" data-act="tolist">Ver mis profes ✅</button>
  </div>`;

/* ===================== FORMULARIO: ayudas ===================== */
function postForm() {
  if (pendientes.has(dk(S.cur))) {
    bloquear(true);
    mostrarMsg("⏳ Tu evaluación se está enviando. Espera un momentico o toca “Intentar otra vez”. No cierres esta página.", true);
  }
}
function bloquear(on) {
  $app.querySelectorAll(".lv, #com, .rs, [data-act=prev], [data-act=skip]").forEach(el => { el.disabled = on; });
}
function mostrarMsg(txt, info) {
  const m = document.getElementById("msg"); if (!m) return;
  m.textContent = txt; m.classList.toggle("info", !!info); m.classList.remove("hide"); pintarEmojis(m);
  try { m.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
}
function ocultarMsg() { const m = document.getElementById("msg"); if (m) m.classList.add("hide"); }
function boton(txt, disabled) {
  const b = document.getElementById("send"); if (!b) return;
  b.textContent = txt; b.disabled = !!disabled; pintarEmojis(b);
}
function irPaso(i, dir) {
  const d = draft(S.cur);
  d.step = Math.min(Math.max(0, i), S.preg.length);
  S.dir = dir; render(); arriba();
}
function celebrar(despues) {
  vib([20, 40, 20]); confeti(46);
  const o = document.createElement("div"); o.id = "celebra";
  o.innerHTML = `${medalla("✅")}<b>¡Listo!</b><p class="muted" style="margin-top:4px;font-size:17px;font-weight:700">¡Gracias por tu opinión!</p>`;
  document.body.appendChild(o); pintarEmojis(o);
  setTimeout(() => { o.remove(); despues(); }, 1300);
}

/* ===================== ENVÍO (única escritura: addDoc en evaluacion_docentes) ===================== */
async function enviar() {
  const it = S.cur; if (!it) return;
  const k = dk(it), d = draft(it);
  if (isDone(it)) { retroceder(todos() ? "thanks" : "list"); return; }

  let p = pendientes.get(k);
  if (!p) {
    if (respondidas(d) < S.preg.length) {
      toast("Te falta responder una pregunta 👀");
      irPaso(primeraSinResponder(d), "atras"); return;
    }
    if (sinRed()) {
      d.err = "📶 No tienes internet ahora. Tus respuestas siguen aquí: conéctate y toca “Enviar 💌” otra vez.";
      mostrarMsg(d.err); return;
    }
    const r = {};
    S.preg.forEach(q => { r[q.id] = Math.min(S.escala.max, Math.max(1, Math.round(Number(d.r[q.id])))); });
    const payload = {
      v: 3,
      campana: S.campana,
      courseId: it.courseId, courseName: String(it.courseName || ""),
      teacherId: it.teacherId, teacherName: String(it.teacherName || ""),
      materias: String(it.materias || ""),
      r,
      max: S.escala.max,
      comentario: S.comentario.activo ? String(d.c || "").trim().slice(0, MAX_COM) : "",
      ts: Date.now(),
      dev: DEV,
      seg: segundos(d)
    };
    try { p = addDoc(collection(db, "evaluacion_docentes"), payload); }
    catch (e) { d.err = describirEnvio(e); mostrarMsg(d.err); return; }

    pendientes.set(k, p);
    p.then(() => {
      pendientes.delete(k); marcar(it); drafts.delete(k); confirmado(it);
    }, e => {
      pendientes.delete(k); d.err = describirEnvio(e);
      if (S.screen === "form" && S.cur && dk(S.cur) === k) { bloquear(false); boton("Enviar 💌", false); mostrarMsg(d.err); }
      else if (S.screen === "list") render();
    });
  }

  d.err = ""; ocultarMsg(); bloquear(true); boton("Enviando… ✨", true);
  try {
    await conTiempo(p, T_ENVIO);
  } catch (e) {
    if (!pendientes.has(k)) return; // falló de verdad: ya se manejó arriba
    // Tiempo agotado: el envío sigue en cola. Reintentar reutiliza el MISMO envío (no se duplica).
    if (S.screen === "form" && S.cur && dk(S.cur) === k) {
      boton("Intentar otra vez 🔄", false);
      mostrarMsg("⏳ El internet está lento y tu evaluación todavía no llega. Se sigue enviando sola: espera un momentico o toca “Intentar otra vez”. No cierres esta página.", true);
    }
  }
}
function confirmado(it) {
  if (S.screen === "form" && S.cur && dk(S.cur) === dk(it)) {
    celebrar(() => {
      if (S.screen === "form" && S.cur && dk(S.cur) === dk(it)) retroceder(todos() ? "thanks" : "list");
    });
  } else {
    toast(`✅ ¡Listo! Se envió la evaluación de ${it.teacherName}`);
    if (S.screen === "list") { if (todos()) { S.screen = "thanks"; confeti(60); } render(); }
  }
}

/* ===================== EVENTOS ===================== */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  switch (act) {
    case "reload": cargar(); break;
    case "start": avanzar("courses"); break;
    case "back": retroceder(); break;
    case "course": {
      const c = S.courses[+b.dataset.i]; if (!c) return;
      S.course = c; S.items = c.items; avanzar("list"); break;
    }
    case "open": {
      const it = S.items[+b.dataset.i]; if (!it) return;
      if (isDone(it)) { toast("Ya evaluaste a este profe ✅"); return; }
      S.cur = it;
      const d = draft(it);
      if (!pendientes.has(dk(it))) d.step = primeraSinResponder(d);
      d.openAt = Date.now(); S.dir = "adelante"; avanzar("form"); break;
    }
    case "prev": {
      if (S.anim) return;
      const d = draft(S.cur);
      if (d.step <= 0) retroceder(); else irPaso(d.step - 1, "atras");
      break;
    }
    case "skip": toast("Profe saltado. Puedes evaluarlo después 👍"); retroceder(); break;
    case "goto": irPaso(+b.dataset.i, "atras"); break;
    case "opt": {
      if (!S.cur || S.anim || pendientes.has(dk(S.cur))) return;
      const d = draft(S.cur), q = S.preg[d.step], v = +b.dataset.v;
      if (!q || !valido(v)) return;
      d.r[q.id] = v;
      $app.querySelectorAll(".lv").forEach(o => {
        const on = +o.dataset.v === v; o.classList.toggle("on", on); o.setAttribute("aria-pressed", on);
      });
      vib(12);
      S.anim = true;
      const cur = S.cur, paso = d.step;
      setTimeout(() => {
        S.anim = false;
        if (S.screen !== "form" || S.cur !== cur || draft(cur).step !== paso) return;
        irPaso(paso + 1, "adelante");
      }, REDUCIR ? 150 : 420);
      break;
    }
    case "send": enviar(); break;
    case "tolist": S.screen = "list"; render(); arriba(); break;
    case "nuevo": nuevoEstudiante(); break;
    case "terminar": {
      // doble toque para no reiniciar por error (sin ventanas emergentes)
      if (b.dataset.ok !== "1") {
        b.dataset.ok = "1"; b.textContent = "¿Seguro? Toca otra vez para terminar";
        setTimeout(() => { if (b.isConnected) { b.dataset.ok = ""; b.textContent = "🏁 Ya terminé · Siguiente estudiante"; pintarEmojis(b); } }, 3500);
        return;
      }
      nuevoEstudiante(); break;
    }
  }
});
$app.addEventListener("input", e => {
  if (e.target.id !== "com" || !S.cur) return;
  const d = draft(S.cur);
  if (e.target.value.length > MAX_COM) e.target.value = e.target.value.slice(0, MAX_COM);
  d.c = e.target.value;
  const cc = document.getElementById("cc"); if (cc) cc.textContent = d.c.length;
});
window.addEventListener("offline", () => toast("📶 Te quedaste sin internet"));
window.addEventListener("online", () => toast("✅ ¡Volvió el internet!"));
window.addEventListener("beforeunload", e => { if (pendientes.size) { e.preventDefault(); e.returnValue = ""; } });

document.getElementById("foot").textContent = `v${APP_VERSION} · build ${APP_BUILD}`;
cargar();
</script>
</body>
</html>
