<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6c5ce7">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Evalúa a tus profes · I.E.T. Liceo Moderno Suesca</title>
<style>
  :root{
    --pri:#6c5ce7; --pri2:#4b3bc4; --txt:#2d2a4a; --mut:#6e6a8c; --card:#fff; --line:#e7e3f7;
    --ok:#22b573; --okbg:#e3f8ee; --err:#d64545; --errbg:#ffecec; --info:#8a6100; --infobg:#fff4d6;
    --r:24px; --sh:0 4px 16px rgba(76,60,170,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
       background:linear-gradient(180deg,#f3efff 0%,#eaf6ff 60%,#fff7ec 100%) fixed;color:var(--txt);
       line-height:1.35;min-height:100vh;-webkit-tap-highlight-color:transparent;font-size:17px}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
  button:disabled{cursor:default}
  h1,h2,h3{line-height:1.2}

  /* Encabezado compacto */
  .top{background:linear-gradient(135deg,#7d6cf0,#5a8dee);color:#fff;padding:10px 16px 12px;
       padding-top:calc(10px + env(safe-area-inset-top));border-radius:0 0 24px 24px;box-shadow:0 4px 14px rgba(90,80,200,.25)}
  .top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:10px}
  .logo{font-size:28px;line-height:1}
  .top h1{font-size:18px;font-weight:900}
  .top .sch{font-size:12px;opacity:.92}
  .camp{margin-left:auto;font-size:11px;font-weight:800;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:99px;white-space:nowrap}

  main{max-width:620px;margin:0 auto;padding:14px 14px 24px}
  .card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:14px}
  .center{text-align:center}
  .big{font-size:76px;line-height:1;margin:4px 0 12px;display:inline-block}
  .rebota{animation:rebota 1.6s ease-in-out infinite}
  @keyframes rebota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .muted{color:var(--mut);font-size:15px}
  .txt-cfg{font-size:19px;font-weight:700;line-height:1.45;margin:4px 0 18px;white-space:normal}
  .anon{display:inline-block;background:#efeaff;color:var(--pri2);font-weight:800;font-size:14px;border-radius:99px;padding:7px 14px;margin-bottom:18px}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:62px;border-radius:20px;
       font-size:21px;font-weight:900;padding:12px 18px;transition:transform .1s}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(135deg,#7d6cf0,#5a8dee);color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.35)}
  .btn.send{background:linear-gradient(135deg,#ff7eb6,#ff9a62);color:#fff;box-shadow:0 6px 16px rgba(255,126,140,.4)}
  .btn.ghost{background:#efeaff;color:var(--pri2);font-size:18px}
  .btn:disabled{opacity:.65}
  .link{color:var(--pri2);font-weight:800;font-size:16px;padding:10px 4px;min-height:46px}
  .link.muted{color:var(--mut)}
  .link:disabled{opacity:.35}
  .toprow{display:flex;justify-content:space-between;align-items:center;margin:-6px 0 6px}
  h2.t{font-size:24px;font-weight:900}

  /* Cursos */
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .curso{border-radius:22px;min-height:96px;padding:12px;font-weight:900;font-size:19px;box-shadow:var(--sh);
         display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:3px solid rgba(0,0,0,.04)}
  .curso .e{font-size:30px}
  .curso:active{transform:scale(.96)}
  @media (min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}

  /* Lista de profes */
  .prog{height:14px;background:#ece8fb;border-radius:99px;overflow:hidden;margin:12px 0 8px}
  .prog>div{height:100%;background:linear-gradient(90deg,#7ee0a5,var(--ok));border-radius:99px;transition:width .5s}
  .item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:22px;
        box-shadow:var(--sh);padding:14px;margin-bottom:12px;min-height:82px;border:3px solid transparent}
  .item:active{transform:scale(.98);border-color:#cfc6ff}
  .item.done{background:#f2fbf6;box-shadow:none;border-color:#c8eed9}
  .av{width:54px;height:54px;border-radius:50%;color:#fff;font-weight:900;font-size:19px;display:flex;align-items:center;
      justify-content:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
  .av.sm{width:38px;height:38px;font-size:14px}
  .item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
  .item .tx b{font-size:18px}
  .item .tx span{font-size:15px;color:var(--mut)}
  .st{font-size:14px;font-weight:900;white-space:nowrap;flex:none;padding:6px 10px;border-radius:99px}
  .st.go{background:#efeaff;color:var(--pri2)} .st.ok{background:var(--okbg);color:#178a55}
  .st.pend{background:var(--infobg);color:var(--info)} .st.cont{background:#fff0e0;color:#b45d00}
  .ok-note{background:var(--okbg);color:#178a55;border-radius:16px;padding:12px;font-weight:800;margin-top:8px;font-size:16px}

  /* Pregunta (una por pantalla) */
  .quien{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.75);border-radius:99px;padding:5px 14px 5px 5px;
         margin-bottom:10px;font-size:14px;min-width:0}
  .quien b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .quien span{color:var(--mut)}
  .quien div{min-width:0}
  .dots{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin:4px 0 6px}
  .dot{width:12px;height:12px;border-radius:50%;background:#dcd5fb;transition:all .25s}
  .dot.ok{background:var(--ok)}
  .dot.cur{background:var(--pri);transform:scale(1.35);box-shadow:0 0 0 3px #e3ddff}
  .pnum{text-align:center;font-size:14px;font-weight:800;color:var(--mut);margin-bottom:10px}
  .preg{text-align:center;padding:18px 18px 20px}
  .preg .pe{font-size:62px;line-height:1;display:block;margin-bottom:10px}
  .preg .pt{font-size:22px;font-weight:900;line-height:1.3}
  .chip{display:inline-block;font-size:12px;font-weight:800;color:var(--mut);background:#f3f1fb;border-radius:99px;padding:4px 10px;margin-top:10px}
  .lv{display:flex;align-items:center;gap:14px;width:100%;min-height:60px;padding:8px 16px;border-radius:20px;text-align:left;
      background:hsl(var(--h),90%,95%);border:3px solid hsl(var(--h),70%,84%);font-size:19px;font-weight:900;color:var(--txt);
      margin-bottom:9px;transition:transform .12s,background .15s,border-color .15s}
  .lv:active{transform:scale(.97)}
  .lv .le{font-size:36px;line-height:1;flex:none}
  .lv .lt{flex:1}
  .lv .lc{opacity:0;width:32px;height:32px;border-radius:50%;background:hsl(var(--h),62%,40%);color:#fff;display:flex;
          align-items:center;justify-content:center;font-size:18px;flex:none;transform:scale(.4);transition:all .2s}
  .lv.on{background:hsl(var(--h),85%,82%);border-color:hsl(var(--h),62%,40%);animation:pop .38s}
  .lv.on .lc{opacity:1;transform:scale(1)}
  .lv:disabled{opacity:.6}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
  .paso{animation:entra .28s ease-out}
  .paso.atras{animation:entraAtras .28s ease-out}
  @keyframes entra{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
  @keyframes entraAtras{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}

  /* Pantalla final del docente */
  .resumen{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:6px 0 4px}
  .rs{display:flex;align-items:center;gap:4px;background:#f6f4ff;border:2px solid var(--line);border-radius:14px;padding:6px 10px;font-size:22px;min-height:46px}
  .rs small{font-size:11px;color:var(--mut);font-weight:800}
  .lbl{font-size:19px;font-weight:900;display:block;margin-bottom:10px}
  .resp{font-size:14px;background:var(--infobg);color:var(--info);border-radius:14px;padding:9px 12px;margin-bottom:10px;font-weight:700}
  textarea{width:100%;font:inherit;font-size:17px;border:3px solid var(--line);border-radius:18px;padding:12px;resize:vertical;
           min-height:110px;background:#fbfaff;color:var(--txt)}
  textarea:focus{outline:none;border-color:var(--pri);background:#fff}
  .cnt{text-align:right;font-size:13px;color:var(--mut);margin-top:4px;font-weight:700}
  .msg{border-radius:18px;padding:14px;margin-bottom:14px;font-size:16px;font-weight:800;background:var(--errbg);color:var(--err)}
  .msg.info{background:var(--infobg);color:var(--info)}
  .hide{display:none!important}

  /* Varios */
  .spin{width:48px;height:48px;border:5px solid #ddd6fb;border-top-color:var(--pri);border-radius:50%;margin:40px auto 14px;
        animation:g .9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  #toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2d2a4a;color:#fff;padding:13px 20px;
         border-radius:16px;font-size:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;
         max-width:90vw;text-align:center;z-index:30}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #celebra{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
           background:rgba(255,255,255,.88);z-index:25;text-align:center}
  #celebra .e{font-size:96px;animation:salta .6s ease-out}
  #celebra b{font-size:28px;font-weight:900;color:var(--ok);margin-top:8px}
  @keyframes salta{0%{transform:scale(.2) rotate(-20deg);opacity:0}60%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:scale(1)}}
  .confeti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:26}
  .confeti i{position:absolute;top:-14px;width:10px;height:15px;border-radius:3px;animation-name:cae;animation-timing-function:ease-in;animation-fill-mode:forwards}
  @keyframes cae{to{transform:translate(var(--dx),106vh) rotate(var(--rot))}}
  footer{text-align:center;font-size:11px;color:#a29dbd;padding:6px 0 18px}
  @media (max-width:350px){
    .lv{min-height:54px;font-size:17px}.lv .le{font-size:31px}.preg .pe{font-size:52px}.preg .pt{font-size:20px}
    .card{padding:16px}.big{font-size:64px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="in">
    <div class="logo">🌈</div>
    <div>
      <h1>¡Evalúa a tus profes!</h1>
      <div class="sch" id="sch">I.E.T. Liceo Moderno Suesca</div>
    </div>
    <span class="camp hide" id="camp"></span>
  </div>
</header>

<main id="app">
  <div class="center"><div class="spin"></div><p class="muted">Cargando…</p></div>
</main>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>

<!-- Vigilante: si el módulo no carga (sin internet o navegador muy viejo), avisar en vez de quedarse en blanco -->
<script>
  window.__evBoot = false;
  setTimeout(function () {
    if (window.__evBoot) return;
    var a = document.getElementById('app');
    if (a) a.innerHTML =
      '<div class="card center"><div class="big">📶</div><h2 class="t">¡Uy! No pudimos cargar</h2>' +
      '<p class="muted" style="margin:10px 0 18px">Revisa que tengas internet e inténtalo otra vez.</p>' +
      '<button class="btn primary" onclick="location.reload()">Intentar de nuevo 🔄</button></div>';
  }, 20000);
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { initializeFirestore, getFirestore, doc, getDoc, collection, addDoc }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

window.__evBoot = true;

/* ===================== VERSIÓN ===================== */
const APP_VERSION = "2.0.0";
const APP_BUILD = "2026-11-16b";
const CHANGELOG = [
  { v: "2.0.0", fecha: "2026-11-16", cambios: [
    "Diseño para niños: emojis y letra grandes, colores suaves, animaciones cortas.",
    "Todo el contenido viene de evaluacion_config/actual: escala, preguntas con emoji, comentario, bienvenida y gracias.",
    "Una pregunta por pantalla: avanza sola al tocar, puntos de progreso y botón para volver.",
    "Escala configurable (escala.max y niveles); si no viene, 1 a 5 por defecto.",
    "Cierre por fecha (cierre AAAA-MM-DD).",
    "Formato de guardado v:2 con campo max.",
    "Celebración con confeti al enviar y tarjetas “✅ ¡Listo!”."
  ]},
  { v: "1.0.0", fecha: "2026-11-16", cambios: [
    "Primera versión: encuesta anónima, escala 1–5, comentario opcional, control de duplicados por dispositivo."
  ]}
];
window.EVAL_APP = { APP_VERSION, APP_BUILD, CHANGELOG };

/* ===================== FIREBASE ===================== */
const firebaseConfig = {
  apiKey: "AIzaSyBoQmO-jPv9b5VnKpoBA9g_GhIdHC9q7I0",
  authDomain: "liceo-suesca-notas.firebaseapp.com",
  projectId: "liceo-suesca-notas",
  storageBucket: "liceo-suesca-notas.firebasestorage.app",
  messagingSenderId: "1000406739498",
  appId: "1:1000406739498:web:0a4f75c4e7e8c03f9a4e2a"
};
const fbApp = initializeApp(firebaseConfig);
let db;
try { db = initializeFirestore(fbApp, { experimentalForceLongPolling: true }); }
catch (e) { db = getFirestore(fbApp); }

/* ===================== CONSTANTES ===================== */
const EXCLUIR = new Set(["mohp330hwcvu", "mohp3853e4xr"]); // Disciplina, Conducta
const ESCALA_DEF = { max: 5, niveles: [
  { v: 1, emoji: "😡", texto: "Nunca" },
  { v: 2, emoji: "😟", texto: "Casi nunca" },
  { v: 3, emoji: "😐", texto: "A veces" },
  { v: 4, emoji: "😀", texto: "Casi siempre" },
  { v: 5, emoji: "🤩", texto: "Siempre" }
]};
const BIENVENIDA_DEF = "¡Hola! 👋 Queremos saber cómo te va en tus clases.\nEs anónima: nadie sabrá lo que respondes. Contesta con sinceridad y respeto. ¡Son solo unos minutos!";
const GRACIAS_DEF = "¡Muchas gracias por ayudarnos a mejorar! 💙\nTus respuestas son anónimas y nos sirven muchísimo.";
const COMENTARIO_DEF = "¿Quieres dejarle un mensaje a tu profe? 💌 (si quieres)";
const MAX_COM = 500;
const T_LECTURA = 20000;   // ms máximo para leer datos
const T_ENVIO = 15000;     // ms antes de avisar "conexión lenta"
const PASTEL = ["#ffe3e3", "#fff3bf", "#d3f9d8", "#d0ebff", "#e5dbff", "#ffe8cc", "#c3fae8", "#ffdeeb"];
const GRADOS = [
  [/\bPRE[\s-]*(KINDER|JARDIN)\b/, 0],
  [/\b(KINDER|JARDIN)\b/, 1],
  [/\bTRANSICION\b/, 2],
  [/\bPRIMERO\b/, 3],
  [/\bSEGUNDO\b/, 4],
  [/\bTERCERO\b/, 5],
  [/\bCUARTO\b/, 6],
  [/\bQUINTO\b/, 7],
  [/\bSEXTO\b/, 8],
  [/\bSEP?TIMO\b/, 9],
  [/\bOCTAVO\b/, 10],
  [/\bNOVENO\b/, 11],
  [/\b(UNDECIMO|ONCE)\b/, 13],
  [/\bDECIMO\b/, 12]
];
const REDUCIR = (() => { try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { return false; } })();

/* ===================== ALMACENAMIENTO LOCAL (siempre en try/catch) ===================== */
const LS = {
  get(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { window.localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
function nuevoId() {
  try { if (window.crypto && typeof window.crypto.randomUUID === "function") return window.crypto.randomUUID(); } catch (e) {}
  try {
    const b = new Uint8Array(16); window.crypto.getRandomValues(b);
    b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
    const h = Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
    return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`;
  } catch (e) {}
  return "x" + Date.now().toString(36) + Math.random().toString(36).slice(2, 12);
}
// Identificador aleatorio del dispositivo: solo evita contar doble, no identifica a nadie.
let DEV = LS.get("evd_dev");
if (!DEV) { DEV = nuevoId(); LS.set("evd_dev", DEV); }

/* ===================== ESTADO ===================== */
const $app = document.getElementById("app");
const S = {
  screen: "loading", err: "", cerradoNota: "",
  campana: "", preg: [], desde: 0, escala: ESCALA_DEF,
  comentario: { activo: true, texto: COMENTARIO_DEF }, bienvenida: BIENVENIDA_DEF, gracias: GRACIAS_DEF,
  courses: [], asig: [], subj: new Map(), teach: new Map(),
  course: null, items: [], cur: null, next: null, anim: false, dir: ""
};
const drafts = new Map();      // respuestas en memoria por docente (no se pierden al saltar o fallar)
const pendientes = new Map();  // envíos en curso (evita duplicados si la red está lenta)
const hechosMem = new Set();   // respaldo si localStorage no está disponible
let navDepth = 0;

/* ===================== UTILIDADES ===================== */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const escBr = s => esc(s).replace(/\r?\n/g, "<br>");
const norm = s => String(s == null ? "" : s).normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase().replace(/\s+/g, " ").trim();
function lista(x) {
  if (!x) return [];
  if (Array.isArray(x)) return x.filter(v => v && typeof v === "object");
  if (typeof x === "object") return Object.keys(x).map(k => {
    const v = x[k];
    return v && typeof v === "object" ? Object.assign({ id: k }, v) : null;
  }).filter(Boolean);
  return [];
}
function nombre(o) {
  if (!o) return "";
  const n = o.name || o.nombre || o.fullName || o.nombreCompleto || o.displayName ||
    [o.firstName, o.lastName].filter(Boolean).join(" ") || [o.nombres, o.apellidos].filter(Boolean).join(" ");
  return String(n || "").trim();
}
function gradoIdx(nombreCurso) {
  const n = norm(nombreCurso);
  for (const [re, i] of GRADOS) if (re.test(n)) return i;
  return -1;
}
function iniciales(n) {
  const p = String(n || "").replace(/[^\p{L}\s]/gu, " ").trim().split(/\s+/).filter(Boolean);
  return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length > 2 ? 2 : 1][0] : "")).toUpperCase();
}
function colorDe(s) {
  let h = 0; const t = String(s);
  for (let i = 0; i < t.length; i++) h = (h * 31 + t.charCodeAt(i)) >>> 0;
  return `hsl(${h % 360},55%,55%)`;
}
function hoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function conTiempo(p, ms) {
  let t;
  return Promise.race([p, new Promise((_, rej) => { t = setTimeout(() => rej(Object.assign(new Error("timeout"), { code: "timeout" })), ms); })])
    .finally(() => clearTimeout(t));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2800);
}
function vib(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 10); } catch (e) {} }
function arriba() { try { window.scrollTo(0, 0); } catch (e) {} }
function sinRed() { return typeof navigator.onLine === "boolean" && navigator.onLine === false; }
function confeti(n) {
  if (REDUCIR) return;
  const box = document.createElement("div"); box.className = "confeti";
  const cols = ["#ff6b6b", "#ffd93d", "#6bcb77", "#4d96ff", "#c77dff", "#ff9f1c", "#ff7eb6"];
  for (let i = 0; i < (n || 40); i++) {
    const s = document.createElement("i");
    s.style.left = (Math.random() * 100) + "vw";
    s.style.background = cols[i % cols.length];
    s.style.setProperty("--dx", ((Math.random() * 2 - 1) * 90).toFixed(0) + "px");
    s.style.setProperty("--rot", (Math.random() * 900 - 450).toFixed(0) + "deg");
    s.style.animationDuration = (1.2 + Math.random() * 0.9).toFixed(2) + "s";
    s.style.animationDelay = (Math.random() * 0.3).toFixed(2) + "s";
    box.appendChild(s);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 2700);
}

/* ===================== EVALUADOS (duplicados) ===================== */
const dk = it => `evd_ok|${S.campana}|${it.courseId}|${it.subjectId}|${it.teacherId}`;
const isDone = it => hechosMem.has(dk(it)) || LS.get(dk(it)) === "1";
function marcar(it) { hechosMem.add(dk(it)); LS.set(dk(it), "1"); }
const todos = () => S.items.length > 0 && S.items.every(isDone);
const valido = v => Number.isInteger(v) && v >= 1 && v <= S.escala.max;
function draft(it) {
  const k = dk(it);
  if (!drafts.has(k)) drafts.set(k, { r: {}, c: "", acc: 0, openAt: 0, err: "", step: 0 });
  return drafts.get(k);
}
const respondidas = d => S.preg.reduce((n, q) => n + (valido(d.r[q.id]) ? 1 : 0), 0);
const primeraSinResponder = d => { const i = S.preg.findIndex(q => !valido(d.r[q.id])); return i < 0 ? S.preg.length : i; };

/* ===================== CONFIGURACIÓN ===================== */
function leerEscala(e) {
  if (!e || typeof e !== "object") return ESCALA_DEF;
  const vistos = new Set();
  let niv = (Array.isArray(e.niveles) ? e.niveles : [])
    .map(n => ({ v: Math.round(Number(n && n.v)), emoji: String((n && n.emoji) || "").trim(), texto: String((n && n.texto) || "").trim() }))
    .filter(n => Number.isInteger(n.v) && n.v >= 1 && !vistos.has(n.v) && vistos.add(n.v))
    .sort((a, b) => a.v - b.v);
  let max = Math.round(Number(e.max));
  if (!Number.isInteger(max) || max < 2) max = niv.length ? niv[niv.length - 1].v : 0;
  niv = niv.filter(n => n.v <= max).map(n => ({ v: n.v, emoji: n.emoji || "⭐", texto: n.texto || String(n.v) }));
  if (niv.length < 2) return ESCALA_DEF;
  return { max, niveles: niv };
}
function fechaCierre(c) {
  if (!c) return "";
  if (typeof c === "string") return /^\d{4}-\d{2}-\d{2}/.test(c.trim()) ? c.trim().slice(0, 10) : "";
  try {
    const d = typeof c.toDate === "function" ? c.toDate() : null;
    if (d) return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  } catch (e) {}
  return "";
}

/* ===================== CARGA (solo lectura) ===================== */
async function cargar() {
  S.screen = "loading"; render();
  try {
    const cs = await conTiempo(getDoc(doc(db, "evaluacion_config", "actual")), T_LECTURA);
    if (!cs.exists()) return cerrar("");
    const cfg = cs.data() || {};
    if (cfg.abierta !== true) return cerrar("");
    const cierre = fechaCierre(cfg.cierre);
    if (cierre && hoyISO() > cierre) return cerrar("");

    const vistos = new Set();
    S.preg = (Array.isArray(cfg.preguntas) ? cfg.preguntas : [])
      .filter(q => q && q.id != null && String(q.texto || "").trim())
      .map(q => ({ id: String(q.id).trim(), texto: String(q.texto).trim(),
                   emoji: String(q.emoji || "").trim() || "⭐", dim: q.dim ? String(q.dim).trim() : "" }))
      .filter(q => q.id && !vistos.has(q.id) && vistos.add(q.id));
    S.campana = String(cfg.campana || "").trim();
    const d = Number(cfg.desdeGrado);
    S.desde = Number.isFinite(d) ? d : 0;
    S.escala = leerEscala(cfg.escala);
    const com = cfg.comentario;
    S.comentario = (com && typeof com === "object")
      ? { activo: com.activo === true, texto: String(com.texto || "").trim() || COMENTARIO_DEF }
      : { activo: true, texto: COMENTARIO_DEF };   // configuración vieja: comentario opcional como en v1
    S.bienvenida = String(cfg.bienvenida || "").trim() || BIENVENIDA_DEF;
    S.gracias = String(cfg.gracias || "").trim() || GRACIAS_DEF;
    if (!S.campana || !S.preg.length) return cerrar("La encuesta todavía no está lista.");

    const ds = await conTiempo(getDoc(doc(db, "system", "data")), T_LECTURA);
    if (!ds.exists()) throw Object.assign(new Error("sin datos"), { code: "sin-datos" });
    procesar(ds.data() || {});

    const camp = document.getElementById("camp");
    camp.textContent = S.campana; camp.classList.remove("hide");

    S.screen = "welcome"; navDepth = 0;
    try { history.replaceState({ s: "welcome", d: 0 }, ""); } catch (e) {}
    render();
  } catch (e) {
    S.err = describirLectura(e); S.screen = "error"; render();
  }
}
function cerrar(nota) { S.cerradoNota = nota || ""; S.screen = "closed"; render(); }

function procesar(data) {
  S.subj = new Map(lista(data.subjects).map(s => [String(s.id), s]));
  S.teach = new Map(lista(data.teachers).map(t => [String(t.id), t]));
  S.asig = lista(data.subjectAssignments);
  S.courses = lista(data.courses)
    .map(c => ({ id: c.id, name: nombre(c) || String(c.id), order: Number(c.order), idx: gradoIdx(nombre(c)) }))
    .filter(c => c.id != null && c.idx >= 0 && c.idx >= S.desde)
    .map(c => Object.assign(c, { items: itemsDe(c) }))
    .filter(c => c.items.length > 0)
    .sort((a, b) => (Number.isFinite(a.order) ? a.order : 1e9) - (Number.isFinite(b.order) ? b.order : 1e9) ||
                    a.name.localeCompare(b.name, "es", { numeric: true }));
}
function docenteDe(a) {
  if (a.currentTeacherId) return a.currentTeacherId;
  const h = (Array.isArray(a.history) ? a.history : lista(a.history)).filter(x => x && typeof x === "object" && !x.removedAt);
  if (!h.length) return null;
  const u = h[h.length - 1];
  return u.teacherId || u.teacher || u.id || null;
}
function itemsDe(course) {
  const out = [], vistos = new Set();
  for (const a of S.asig) {
    if (a.courseId == null || String(a.courseId) !== String(course.id)) continue;
    const sid = a.subjectId;
    if (sid == null || EXCLUIR.has(String(sid))) continue;
    const sub = S.subj.get(String(sid));
    if (!sub) continue;
    const sn = nombre(sub);
    if (!sn || norm(sn) === "DISCIPLINA" || norm(sn) === "CONDUCTA") continue;
    const tid = docenteDe(a);
    if (tid == null) continue;
    const t = S.teach.get(String(tid));
    if (!t) continue;
    const it = { courseId: course.id, courseName: course.name, subjectId: sid, subjectName: sn,
                 teacherId: tid, teacherName: nombre(t) || "Profe" };
    const k = `${it.courseId}|${it.subjectId}|${it.teacherId}`;
    if (vistos.has(k)) continue;
    vistos.add(k); out.push(it);
  }
  return out.sort((x, y) => x.subjectName.localeCompare(y.subjectName, "es"));
}
function describirLectura(e) {
  const c = (e && e.code) || "";
  if (c === "permission-denied") return "El sistema no nos dejó abrir la encuesta. Avísale a tu profe. 🙏";
  if (c === "sin-datos") return "No encontramos la lista de cursos y profes. Avísale a tu profe. 🙏";
  if (sinRed() || c === "timeout" || c === "unavailable" || /offline/i.test((e && e.message) || ""))
    return "Parece que no hay internet o está muy lento. Revisa la conexión e inténtalo otra vez.";
  return "Pasó algo inesperado" + (c ? ` (${c})` : "") + ". Inténtalo otra vez.";
}
function describirEnvio(e) {
  const c = (e && e.code) || "";
  if (c === "permission-denied")
    return "🚫 El sistema no recibió tu evaluación. Avísale a tu profe. Tus respuestas siguen guardadas aquí.";
  if (sinRed() || c === "unavailable" || c === "deadline-exceeded")
    return "📶 ¡Uy! Se fue el internet. Tus respuestas siguen aquí; toca “Enviar 💌” para intentar otra vez.";
  return "😕 No se pudo enviar" + (c ? ` (${c})` : "") + ". Tus respuestas siguen aquí; inténtalo otra vez.";
}

/* ===================== NAVEGACIÓN (botón atrás del celular) ===================== */
function avanzar(screen) {
  S.screen = screen; render(); arriba();
  try { history.pushState({ s: screen, d: ++navDepth }, ""); } catch (e) {}
}
function retroceder(dest) {
  S.next = dest || null;
  if (navDepth > 0) { try { history.back(); return; } catch (e) {} }
  const prev = { form: "list", list: "courses", courses: "welcome" }[S.screen] || "welcome";
  S.next = null; aplicar(dest || prev);
}
window.addEventListener("popstate", e => {
  const st = e.state || {};
  navDepth = st.d || 0;
  const t = S.next || st.s || "welcome";
  S.next = null; aplicar(t);
});
function aplicar(t) {
  if (["loading", "closed", "error"].includes(S.screen)) return;
  if (S.screen === "form") salirForm();
  if (t === "form" && !S.cur) t = "list";
  if ((t === "list" || t === "thanks") && !S.course) t = "courses";
  if (t === "form") draft(S.cur).openAt = Date.now();
  S.dir = ""; S.screen = t; render(); arriba();
}
function salirForm() {
  if (!S.cur) return;
  const d = drafts.get(dk(S.cur));
  if (d && d.openAt) { d.acc += Date.now() - d.openAt; d.openAt = 0; }
}
function segundos(d) { return Math.max(1, Math.round((d.acc + (d.openAt ? Date.now() - d.openAt : 0)) / 1000)); }

  const it = S.cur, d = draft(it), N = S.preg.length;

  const step = Math.min(Math.max(0, d.step), N);
  const animCls = S.dir === "atras" ? "paso atras" : S.dir === "adelante" ? "paso" : "";

    : `<div class="prog" style="margin:4px 0 6px"><div style="width:${Math.round(respondidas(d) * 100 / N)}%"></div></div>`;

  if (step < N) {

              <span class="le">${esc(n.emoji)}</span><span class="lt">${esc(n.texto)}</span><span class="lc">✓</span></button>`).join("")}
        </div>
      </div>`;
  }

  // Pantalla final de este profe: resumen + comentario + Enviar
  const com = S.comentario.activo ? `

      <label for="com" class="lbl">${esc(S.comentario.texto)}</label>

      <div class="cnt"><span id="cc">${d.c.length}</span>/${MAX_COM}</div>
    </div>` : "";
  return `${top}${quien}${progreso}
    <div class="${animCls}">
      <div class="card center">
        <div style="font-size:52px;line-height:1">🏁</div>
        <h2 class="t" style="margin:8px 0 6px">¡Ya casi terminas!</h2>
        <p class="muted">Estas fueron tus respuestas. Si quieres cambiar una, tócala.</p>
        <div class="resumen">${S.preg.map((q, i) => {
          const n = S.escala.niveles.find(x => x.v === d.r[q.id]);
          return `<button class="rs" data-act="goto" data-i="${i}" ${pend ? "disabled" : ""}><small>${i + 1}</small>${n ? esc(n.emoji) : "❔"}</button>`;

    </div>`;
}

function postForm() {

    bloquear(true);

function bloquear(on) {
  $app.querySelectorAll(".lv, #com, .rs, [data-act=prev], [data-act=skip]").forEach(el => { el.disabled = on; });
}
function mostrarMsg(txt, info) {
  const m = document.getElementById("msg"); if (!m) return;
  m.textContent = txt; m.classList.toggle("info", !!info); m.classList.remove("hide");
  try { m.scrollIntoView({ behavior: "smooth", block: "center" }); } catch (e) {}
}
function ocultarMsg() { const m = document.getElementById("msg"); if (m) m.classList.add("hide"); }
function boton(txt, disabled) {
  const b = document.getElementById("send"); if (!b) return;
  b.textContent = txt; b.disabled = !!disabled;
}
function irPaso(i, dir) {
  const d = draft(S.cur);
  d.step = Math.min(Math.max(0, i), S.preg.length);
  S.dir = dir; render(); arriba();
}
function celebrar(despues) {
  vib([20, 40, 20]); confeti(46);
  const o = document.createElement("div"); o.id = "celebra";
  o.innerHTML = `<div class="e">✅</div><b>¡Listo!</b><p class="muted" style="margin-top:6px">¡Gracias por tu opinión!</p>`;
  document.body.appendChild(o);
  setTimeout(() => { o.remove(); despues(); }, 1300);
}

/* ===================== ENVÍO (única escritura: addDoc en evaluacion_docentes) ===================== */
async function enviar() {
  const it = S.cur; if (!it) return;
  const k = dk(it), d = draft(it);
  if (isDone(it)) { retroceder(todos() ? "thanks" : "list"); return; }

  let p = pendientes.get(k);
  if (!p) {
    if (respondidas(d) < S.preg.length) {
      toast("Te falta responder una pregunta 👀");
      irPaso(primeraSinResponder(d), "atras"); return;
    }
    if (sinRed()) {
      d.err = "📶 No tienes internet ahora. Tus respuestas siguen aquí: conéctate y toca “Enviar 💌” otra vez.";
      mostrarMsg(d.err); return;
    }
    const r = {};
    S.preg.forEach(q => { r[q.id] = Math.min(S.escala.max, Math.max(1, Math.round(Number(d.r[q.id])))); });
    const payload = {
      v: 2,
      campana: S.campana,
      courseId: it.courseId, courseName: String(it.courseName || ""),
      teacherId: it.teacherId, teacherName: String(it.teacherName || ""),
      subjectId: it.subjectId, subjectName: String(it.subjectName || ""),
      r,
      max: S.escala.max,
      comentario: S.comentario.activo ? String(d.c || "").trim().slice(0, MAX_COM) : "",
      ts: Date.now(),
      dev: DEV,
      seg: segundos(d)
    };
    try { p = addDoc(collection(db, "evaluacion_docentes"), payload); }
    catch (e) { d.err = describirEnvio(e); mostrarMsg(d.err); return; }

    pendientes.set(k, p);
    p.then(() => {
      pendientes.delete(k); marcar(it); drafts.delete(k); confirmado(it);
    }, e => {
      pendientes.delete(k); d.err = describirEnvio(e);
      if (S.screen === "form" && S.cur && dk(S.cur) === k) { bloquear(false); boton("Enviar 💌", false); mostrarMsg(d.err); }
      else if (S.screen === "list") render();
    });
  }

  d.err = ""; ocultarMsg(); bloquear(true); boton("Enviando… ✨", true);
  try {
    await conTiempo(p, T_ENVIO);
  } catch (e) {
    if (!pendientes.has(k)) return; // falló de verdad: ya se manejó arriba
    // Tiempo agotado: el envío sigue en cola. Reintentar reutiliza el MISMO envío (no se duplica).
    if (S.screen === "form" && S.cur && dk(S.cur) === k) {
      boton("Intentar otra vez 🔄", false);
      mostrarMsg("⏳ El internet está lento y tu evaluación todavía no llega. Se sigue enviando sola: espera un momentico o toca “Intentar otra vez”. No cierres esta página.", true);
    }
  }
}
function confirmado(it) {
  if (S.screen === "form" && S.cur && dk(S.cur) === dk(it)) {
    celebrar(() => {
      if (S.screen === "form" && S.cur && dk(S.cur) === dk(it)) retroceder(todos() ? "thanks" : "list");
    });
  } else {
    toast(`✅ ¡Listo! Se envió la evaluación de ${it.teacherName}`);
    if (S.screen === "list") { if (todos()) { S.screen = "thanks"; confeti(60); } render(); }
  }
}

/* ===================== EVENTOS ===================== */
$app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act;
  switch (act) {
    case "reload": cargar(); break;
    case "start": avanzar("courses"); break;
    case "back": retroceder(); break;
    case "course": {
      const c = S.courses[+b.dataset.i]; if (!c) return;
      S.course = c; S.items = c.items; avanzar("list"); break;
    }
    case "open": {
      const it = S.items[+b.dataset.i]; if (!it) return;
      if (isDone(it)) { toast("Ya evaluaste a este profe ✅"); return; }
      S.cur = it;
      const d = draft(it);
      if (!pendientes.has(dk(it))) d.step = primeraSinResponder(d);
      d.openAt = Date.now(); S.dir = "adelante"; avanzar("form"); break;
    }
    case "prev": {
      if (S.anim) return;
      const d = draft(S.cur);
      if (d.step <= 0) retroceder(); else irPaso(d.step - 1, "atras");
      break;
    }
    case "skip": toast("Profe saltado. Puedes evaluarlo después 👍"); retroceder(); break;
    case "goto": irPaso(+b.dataset.i, "atras"); break;
    case "opt": {
      if (!S.cur || S.anim || pendientes.has(dk(S.cur))) return;
      const d = draft(S.cur), q = S.preg[d.step], v = +b.dataset.v;
      if (!q || !valido(v)) return;
      d.r[q.id] = v;
      $app.querySelectorAll(".lv").forEach(o => {
        const on = +o.dataset.v === v; o.classList.toggle("on", on); o.setAttribute("aria-pressed", on);
      });
      vib(12);
      S.anim = true;
      const cur = S.cur, paso = d.step;
      setTimeout(() => {
        S.anim = false;
        if (S.screen !== "form" || S.cur !== cur || draft(cur).step !== paso) return;
        irPaso(paso + 1, "adelante");
      }, REDUCIR ? 150 : 420);
      break;
    }
    case "send": enviar(); break;
    case "tolist": S.screen = "list"; render(); arriba(); break;
  }
});
$app.addEventListener("input", e => {
  if (e.target.id !== "com" || !S.cur) return;
  const d = draft(S.cur);
  if (e.target.value.length > MAX_COM) e.target.value = e.target.value.slice(0, MAX_COM);
  d.c = e.target.value;
  const cc = document.getElementById("cc"); if (cc) cc.textContent = d.c.length;
});
window.addEventListener("offline", () => toast("📶 Te quedaste sin internet"));
window.addEventListener("online", () => toast("✅ ¡Volvió el internet!"));
window.addEventListener("beforeunload", e => { if (pendientes.size) { e.preventDefault(); e.returnValue = ""; } });

document.getElementById("foot").textContent = `v${APP_VERSION} · build ${APP_BUILD}`;
cargar();
</script>
